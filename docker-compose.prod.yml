services:
  # NATS Server
  nats-server:
    image: nats:latest

  # API Client Gateway
  client-gateway:
    build:
      context: ./client-gateway
      dockerfile: dockerfile.prod
    image: client-gateway-prod
    ports:
      - ${CLIENT_GATEWAY_PORT}:${CLIENT_GATEWAY_PORT}
    environment:
      - PORT=${CLIENT_GATEWAY_PORT}
      - NATS_SERVERS=nats://nats-server:4222

  # Auth Microservice
  auth-ms:
    build:
      context: ./auth-ms
      dockerfile: dockerfile.prod
    image: auth-ms
    environment:
      - NATS_SERVERS=nats://nats-server:4222
      - AUTHDB_URL=${AUTHMS_AUTHDB_URL}
      - JWT_SECRET=${AUTHMS_JWT_SECRET}

  # Products Microservice
  products-ms:
    build:
      context: ./products-ms
      dockerfile: dockerfile.prod
    image: products-ms
    environment:
      - PORT=3001
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=file:./dev.db
  
  # Orders Microservice
  orders-ms:
    build: 
      context: ./orders-ms
      dockerfile: dockerfile.prod
      args:
        - ORDERSMS_ORDERSDB_URL=${ORDERSMS_ORDERSDB_URL}
    image: orders-ms
    environment:
      - PORT=3002
      - NATS_SERVERS=nats://nats-server:4222
      - POSTGRES_URL=${ORDERSMS_ORDERSDB_URL}

  # # Orders Database
  # orders-db:
  #   container_name: orders_database
  #   image: postgres:16.11
  #   environment:
  #     POSTGRES_USER: ${ORDERSDB_USER}
  #     POSTGRES_DB: ${ORDERSDB_DB}
  #     POSTGRES_PASSWORD: ${ORDERSDB_PASSWORD}
  #   volumes:
  #     - ./orders-ms/postgres:/var/lib/postgresql/data
  #   ports:
  #     - 5432:5432

  # Payments Microservice
  payments-ms:
    build:
      context: ./payments-ms
      dockerfile: dockerfile.prod
    image: payments-ms
    ports:
      - ${PAYMENTS_MS_PORT}:${PAYMENTS_MS_PORT}
    environment:
      - PORT=${PAYMENTS_MS_PORT}
      - STRIPE_SECRET=${PAYMENTS_MS_STRIPE_SECRET}
      - STRIPE_WEBHOOK_SECRET=${PAYMENTS_MS_STRIPE_WEBHOOK_SECRET}
      - STRIPE_SUCCESS_URL=${PAYMENTS_MS_STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${PAYMENTS_MS_STRIPE_CANCEL_URL}
      - NATS_SERVERS=nats://nats-server:4222

